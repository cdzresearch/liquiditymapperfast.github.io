# Packs the Electron Windows zip and uploads it as a workflow artifact.
# The zip is too large for git and for some artifact mounts (~108 MB).
name: Desktop Windows zip

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-win:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run pack:win
        working-directory: desktop
        env:
          HLM_SOURCEMAP: 'off'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidityMapperFast-win
          path: desktop/release/LiquidityMapperFast-*-win.zip
          if-no-files-found: error
          retention-days: 14
