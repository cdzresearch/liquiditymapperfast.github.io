<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiquidityMapperFast</title>
  <meta name="description" content="A live liquidity heatmap, order-book ladder and footprint for BTC and about 150 other coins across the largest exchanges. Free, no sign-up, open source.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LiquidityMapper">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <div id="app"></div>
  <!-- Module workers cannot start from file://, so a double-clicked index.html stays blank. Say so before boot.ts runs. -->
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var el = document.getElementById('app');
        if (!el) return;
        el.style.cssText = 'font:16px/1.45 system-ui,sans-serif;padding:2rem;max-width:36rem';
        el.textContent = 'Do not open this file in Chrome. Double-click start.bat (Windows) or start.sh (Mac/Linux). That serves the page at http://127.0.0.1:5173/ so the tape can load.';
      });
    }
  </script>
  <script type="module" src="./boot.ts"></script>
</body>
</html>
